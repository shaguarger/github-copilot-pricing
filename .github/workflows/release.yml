name: Release

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create ZIP
        run: |
          mkdir -p dist
          cd custom_components
          zip -r "../dist/github-copilot-pricing.zip" \
            github_copilot_pricing

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GitHub Copilot Pricing ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/github-copilot-pricing.zip