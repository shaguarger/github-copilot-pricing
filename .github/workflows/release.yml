name: Release

"on":
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Prepare manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --tags
          VERSION="$(python -c 'import json; v=json.load(open("custom_components/github_copilot_pricing/manifest.json"))["version"].split("."); v[-1]=str(int(v[-1])+1); print(".".join(v))')"
          export VERSION
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"
          python -c 'import json, os; p="custom_components/github_copilot_pricing/manifest.json"; d=json.load(open(p)); d["version"]=os.environ["VERSION"]; open(p,"w").write(json.dumps(d, indent=2)+"\n")'
          git config user.name shaguarger
          git config user.email 16501863+shaguarger@users.noreply.github.com
          git add custom_components/github_copilot_pricing/manifest.json
          git commit -m "Release v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push --atomic origin \
            HEAD:refs/heads/main \
            "refs/tags/v${VERSION}:refs/tags/v${VERSION}"

      - name: Verify tag release
        if: github.event_name == 'push'
        run: |
          MANIFEST_VERSION="$(python -c 'import json; print(json.load(open("custom_components/github_copilot_pricing/manifest.json"))["version"])')"
          test "v${MANIFEST_VERSION}" = "$TAG"

      - name: Create ZIP
        run: |
          mkdir -p dist
          cd custom_components/github_copilot_pricing
          zip -r "../../dist/github-copilot-pricing.zip" . -x '*/__pycache__/*' '*.pyc'

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: GitHub Copilot Pricing ${{ env.TAG }}
          generate_release_notes: true
          files: dist/github-copilot-pricing.zip
