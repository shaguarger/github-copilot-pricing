name: Release

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify version
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/github_copilot_pricing/manifest.json"))["version"])')"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"

      - name: Create ZIP
        run: |
          mkdir -p dist
          cd custom_components/github_copilot_pricing
          zip -r "../../dist/github-copilot-pricing.zip" .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GitHub Copilot Pricing ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/github-copilot-pricing.zip
